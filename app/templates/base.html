<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Zomboid Admin</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="/static/app.js" defer></script>
  <meta name="csrf-token" content="{{ csrf }}">
</head>
<body class="app-body">
  {% if user %}
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">PZ</span>
        <div>
          <div class="brand-title">Zomboid Admin</div>
          <div class="brand-sub">{{ server_name }}</div>
        </div>
      </div>
      <nav class="nav">
        <a href="/" class="{% if nav == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/server" class="{% if nav == 'server' %}active{% endif %}">Server</a>
        <a href="/workshop" class="{% if nav == 'workshop' %}active{% endif %}">Workshop</a>
        <a href="/sandbox" class="{% if nav == 'sandbox' %}active{% endif %}">Sandbox</a>
      </nav>
      <div class="sidebar-foot">
        <div class="pill {% if running %}on{% else %}off{% endif %}">
          {% if running %}Online{% else %}Offline{% endif %}
        </div>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button type="submit" class="linkish">Log out {{ user }}</button>
        </form>
      </div>
    </aside>
    <main class="main">
      {% if flash %}
      <div class="flash {{ flash.kind }}">{{ flash.message }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
  {% else %}
  <main class="login-wrap">
    {% block login %}{% endblock %}
  </main>
  {% endif %}
</body>
</html>
